name: Release Extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.0.1)"
        required: true
      draft:
        description: "Create as draft release"
        required: true
        default: true
        type: boolean
      prerelease:
        description: "Mark as pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set build environment
        env:
          API_BASE_URL_VAR: ${{ vars.WXT_PUBLIC_API_BASE_URL }}
          API_BASE_URL_SECRET: ${{ secrets.WXT_PUBLIC_API_BASE_URL }}
        run: |
          API_BASE_URL="${API_BASE_URL_SECRET:-$API_BASE_URL_VAR}"
          if [ -z "$API_BASE_URL" ]; then
            echo "Missing WXT_PUBLIC_API_BASE_URL in GitHub Variables or Secrets."
            exit 1
          fi
          echo "WXT_PUBLIC_API_BASE_URL=$API_BASE_URL" >> "$GITHUB_ENV"

      - name: Type check
        run: npm run compile

      - name: Run tests
        run: npm test

      - name: Build Chrome zip
        run: npm run zip

      - name: Build Firefox zip
        run: npm run zip:firefox

      - name: Create GitHub Release and upload zips
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            .output/*.zip
